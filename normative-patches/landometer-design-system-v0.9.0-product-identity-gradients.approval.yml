aliasBoundary: >-
  Inside an ijji or CityWiki product surface the aliased field reads as that
  product's identity; everywhere else the same recipe remains the shared
  Ground/Cultivate atmosphere. Neither reading ever encodes data magnitude or
  semantic state. The alias is declared in the registry (lightAliasOf), never a
  duplicated palette.
