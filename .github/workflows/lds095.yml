name: Validate LDS 0.9.7
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Keep this required check context stable across release versions.
  validate-lds095:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate current package, site and retained history
        run: node tools/validate-release.mjs
      - name: Check installer dry-run and isolated install
        run: |
          python3 tools/install-lds097.py --home /tmp/lds097-install --json
          python3 tools/install-lds097.py --home /tmp/lds097-install --apply --json
          node /tmp/lds097-install/.agents/skills/apply-landometer-design-system/scripts/verify.mjs --json
          node /tmp/lds097-install/.claude/skills/apply-landometer-design-system/scripts/verify.mjs --json
      - name: Check whitespace
        run: git diff --check
