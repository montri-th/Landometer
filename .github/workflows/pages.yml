name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "deployment/**"
      - "normative-patches/**"
      - "tools/**"
      - "skill/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release
        run: node tools/validate-release.mjs

      - name: Verify every governed atmosphere gradient foreground
        run: node tools/check-gradient-contrast.mjs --check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: deployment

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed bytes match this release source
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          TARGET_VERSION: "0.9.0"
          MANIFEST_PATH: site-manifest.v0.9.0.json
          EXPECTED_MANIFEST_VERSION: "2.1"
          EXPECTED_TOKEN_SCHEMA_VERSION: "6"
          EXPECTED_PROFILE: brand.public
          EXPECTED_EVIDENCE_STATUS: source_limited
          EXPECTED_INDEXABLE: "false"
          EXPECTED_MACHINE_VALIDATION: pending
          EXPECTED_ARTIFACT_BUILD: ui-20260821-01
          VERIFY_EXACT_SOURCE: "true"
          LOCAL_DEPLOYMENT_DIR: deployment
          VERIFY_ATTEMPTS: "30"
          VERIFY_DELAY_MS: "10000"
          CRITICAL_ASSETS: >-
            landometer-design-system-v0.9.0-standalone.html,
            landometer-design-system-v0.9.0-standalone.color-srgb-04.ui-20260821-01.html,
            landometer-design-system-v0.9.0-standalone.color-srgb-04.ui-20260820-02.html,
            landometer-design-system-v0.9.0-standalone.color-srgb-04.html,
            landometer-design-system-v0.9.0-standalone.color-srgb-03.ui-20260820-01.html,
            landometer-design-system-v0.9.0-standalone.color-srgb-03.html,
            assets/data/color-delivery.v0.9.0.json,
            qa/v0.9.0-automated.json,
            qa/v0.9.0-scale-geometry.json,
            qa/v0.9.0-gradient-contrast.json,
            implementation-notes.v0.9.0.md,
            llms.txt,
            assets/images/landometer-symbol-transparent.png
        run: node skill/publish-landometer-design-system-github-pages/scripts/verify-live.mjs
