name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate current package and retained history
        run: node tools/validate-release.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deployment
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact deployed bytes from this commit
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tools/verify-live-lds097.mjs
