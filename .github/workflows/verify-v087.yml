name: Validate proposed v0.8.8 release source

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-v087.yml"
      - "deployment/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout proposed source
        uses: actions/checkout@v4

      - name: Install browser geometry dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Verify generated standalone artifacts are reproducible
        run: node tools/build-standalone-html.mjs --check

      - name: Validate repository release
        run: node tools/validate-release.mjs

      - name: Verify experience contracts
        run: node skill/refine-landometer-experience/scripts/check-experience-contracts.mjs

      - name: Verify rendered scale geometry and accessible names
        run: node tools/check-scale-geometry.mjs > /tmp/v0.8.8-scale-geometry-current.json
